<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bear’s Den Admin</title>
<style>body{font:14px Georgia,serif;background:#120a05;color:#f0e6d2;max-width:900px;margin:0 auto;padding:16px}h1,h2{color:#d9a441;font-weight:400}input,select,button{background:#0008;color:#f0e6d2;border:1px solid #d9a44166;padding:6px;margin:2px;font:inherit}button{cursor:pointer;color:#d9a441}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #d9a44133;padding:4px;text-align:left}#msg{color:#e88}</style></head><body>
<h1>Admin</h1><p id="msg"></p>
<form id="lf"><input id="em" type="email" placeholder="admin email" autocomplete="username"><input id="pw" type="password" placeholder="password" autocomplete="current-password"><button>Log in</button></form>
<div id="app" hidden>
<h2>Analytics</h2><div id="an"></div>
<h2>Add brand</h2><form id="bf"><input name="name" placeholder="Name" required><select name="countryId" id="co"></select><select name="categoryId" id="ca"></select><input name="description" placeholder="Description"><button>Add</button></form>
<h2>Add product</h2><form id="pf"><select name="brandId" id="br"></select><input name="name" placeholder="Product name" required><input name="abv" type="number" step="0.1" min="0" max="100" placeholder="ABV % (verified only)"><input name="description" placeholder="Description"><button>Add</button></form>
<h2>Upload asset</h2><form id="uf"><select name="kind"><option>bottle_model</option><option>bear_model</option><option>environment_model</option><option>texture</option><option>thumbnail</option><option>brand_logo</option></select><input name="productId" type="number" placeholder="product id (optional)"><input type="file" name="file" required><button>Upload</button></form>
<h2>Demo pricing (INR)</h2><form id="prf"><select name="productId" id="prp"></select><input name="rupees" type="number" step="0.01" min="0" placeholder="Price ₹" required><input name="disc" type="number" step="0.01" min="0" max="100" placeholder="Discount %" value="0"><select name="status"><option>available</option><option>limited</option><option>unavailable</option></select><button>Save price</button></form>
<h2>Demo orders</h2><table id="ot"></table><h2>Cart activity &amp; popularity</h2><div id="ca"></div><table id="pop"></table>
<h2>Products</h2><table id="pt"></table><h2>Users</h2><table id="ut"></table></div>
<script>
let T='';const $=s=>document.querySelector(s),msg=t=>$('#msg').textContent=t||'';
async function api(p,o={}){const h={Authorization:'Bearer '+T};if(o.body&&!(o.body instanceof FormData))h['Content-Type']='application/json';const r=await fetch('/api'+p,{...o,headers:h});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.status);return r.status==204?null:r.json()}
const cell=(tr,t)=>{const td=document.createElement('td');td.textContent=t;tr.append(td);return td};
const opts=(sel,items,l)=>{sel.replaceChildren(...items.map(i=>new Option(l(i),i.id)))};
async function load(){const [co,ca,br,pr,us,an]=await Promise.all([api('/countries'),api('/categories'),api('/brands?limit=100'),api('/products?limit=100'),api('/admin/users'),api('/admin/analytics')]);
 opts($('#co'),co.items,i=>i.name);opts($('#ca'),ca.items,i=>i.name);opts($('#br'),br.items,i=>i.name);
 $('#an').textContent=`Visitors: ${an.totalVisitors} · Users: ${an.registeredUsers} · Top products: ${an.mostViewedProducts.map(p=>p.name+' ('+p.views+')').join(', ')||'none yet'} · Top searches: ${an.topSearches.map(s=>s.term+' ('+s.n+')').join(', ')||'none yet'}`;
 $('#pt').replaceChildren(...pr.items.map(p=>{const tr=document.createElement('tr');cell(tr,p.id);cell(tr,p.brand);cell(tr,p.name);cell(tr,p.category);const b=document.createElement('button');b.textContent='Delete';b.onclick=async()=>{if(confirm('Delete '+p.name+'?')){try{await api('/products/'+p.id,{method:'DELETE'});load()}catch(e){msg(e.message)}}};cell(tr,'').append(b);return tr}));
 $('#ut').replaceChildren(...us.items.map(u=>{const tr=document.createElement('tr');cell(tr,u.email);cell(tr,u.username);const s=document.createElement('select');['user','admin'].forEach(r=>s.add(new Option(r,r)));s.value=u.role;s.onchange=async()=>{try{await api('/admin/users/'+u.id+'/role',{method:'PATCH',body:JSON.stringify({role:s.value})})}catch(e){msg(e.message);load()}};cell(tr,'').append(s);return tr}))}

const rup=m=>(m/100).toLocaleString('en-IN',{style:'currency',currency:'INR'});
async function loadShop(){const [o,c,p,pr]=await Promise.all([api('/admin/orders'),api('/admin/cart-activity'),api('/admin/popularity'),api('/products?limit=100')]);
 opts($('#prp'),pr.items,i=>i.brand+' · '+i.name+(i.price?' ('+rup(i.price.displayMinor)+')':' (no price)'));
 $('#ot').replaceChildren(...o.items.map(x=>{const tr=document.createElement('tr');[x.reference,x.status,x.customerName||'-',x.itemCount+' items',rup(x.totalMinor),new Date(x.createdAt).toLocaleString()].forEach(t=>cell(tr,t));return tr}));
 $('#ca').textContent='Active carts: '+c.activeCarts+' · Items in carts: '+c.itemsInCarts+' · Recent: '+(c.recent.slice(0,5).map(e=>e.type+(e.product?' '+e.product:'')).join(', ')||'none');
 $('#pop').replaceChildren(...p.items.slice(0,10).map(x=>{const tr=document.createElement('tr');[x.brand+' · '+x.name,'views '+x.views,'cart adds '+x.cartAdds,'units ordered '+x.unitsOrdered].forEach(t=>cell(tr,t));return tr}))}
$('#prf').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));try{await api('/admin/products/'+f.productId+'/price',{method:'PUT',body:JSON.stringify({priceMinor:Math.round(Number(f.rupees)*100),currency:'INR',discountBp:Math.round(Number(f.disc||0)*100),status:f.status})});msg('Price saved');loadShop()}catch(x){msg(x.message)}};
$('#lf').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#em').value,password:$('#pw').value})}),j=await r.json();if(!r.ok)throw new Error(j.error);if(j.user.role!=='admin')throw new Error('Admin role required');T=j.token;$('#lf').hidden=true;$('#app').hidden=false;msg();load();loadShop()}catch(x){msg(x.message)}};
const num=(o,k)=>{if(o[k]!==undefined&&o[k]!=='')o[k]=Number(o[k]);else delete o[k]};
$('#bf').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));num(o,'countryId');num(o,'categoryId');if(!o.description)delete o.description;try{await api('/brands',{method:'POST',body:JSON.stringify(o)});e.target.reset();msg();load()}catch(x){msg(x.message)}};
$('#pf').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));const b=(await api('/brands/'+o.brandId));o.brandId=b.id;o.categoryId=b.categoryId;o.countryId=b.countryId;num(o,'abv');if(!o.description)delete o.description;try{await api('/products',{method:'POST',body:JSON.stringify(o)});e.target.reset();msg();load()}catch(x){msg(x.message)}};
$('#uf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),k=f.get('kind'),pid=f.get('productId');f.delete('kind');f.delete('productId');try{await api('/admin/assets?kind='+k+(pid?'&productId='+pid:''),{method:'POST',body:f});msg('Uploaded');load()}catch(x){msg(x.message)}};
</script></body></html>
